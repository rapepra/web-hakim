<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Geometric font for brutalist look -->
    <style>
      .roof { fill: none; stroke: #1A1A1A; stroke-width: 8; stroke-linecap: square; stroke-linejoin: miter; }
      .hexagon { fill: none; stroke: #1A1A1A; stroke-width: 8; stroke-linejoin: miter; }
      .e3 { fill: #1A1A1A; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 70px; letter-spacing: -4px; }
      .title { fill: #1A1A1A; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 46px; letter-spacing: 1px; }
      .subtitle { fill: #1A1A1A; font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 2px; }
      .subsubtitle { fill: #4a4a4a; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Graphic emblem area (Center X: 200) -->
  <g transform="translate(0, -10)">
    <!-- House Roof -->
    <polyline class="roof" points="100,120 200,45 300,120" />
    <polyline class="roof" points="135,93 135,60 160,60" />

    <!-- Hexagon -->
    <polygon class="hexagon" points="200,60 250,90 250,150 200,180 150,150 150,90" />

    <!-- E3 Text -->
    <text x="160" y="152" class="e3">E3</text>
  </g>

  <!-- Text area -->
  <text x="200" y="225" text-anchor="middle" class="title">ELEGANT3</text>
  <text x="200" y="255" text-anchor="middle" class="subtitle">REFORMAS</text>
  <text x="200" y="278" text-anchor="middle" class="subsubtitle">SERVICIOS INTEGRALES</text>
</svg>
